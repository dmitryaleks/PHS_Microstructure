  note: 'Own computation, not a PSE statistic. The Daily Quotation Report''s "GRAND TOTAL" (normal + odd-lot + block
    + VWAP) is PSE''s headline turnover: the H1-2026 average of PHP 7.72bn/day equals PSE''s published average daily
    value traded. Block sales were PHP 263.6bn of PHP 1,434.7bn (18.4%) over 186 days; odd lot 0.013%; VWAP 0.124%
    (VWAP trades on 67 days). 1,608 block prints parsed (98.5% of reported block value); price analysis uses each
    stock''s latest non-empty prior close without corporate-action adjustment. Cross-check: PSE''s August 2026 Monthly
    Report gives non-regular (block + odd-lot) value of PHP 1,314.15m of PHP 7,561.17m average daily value over
    162 days, i.e. 17.4%, matching the same months of this parse. Only the 2 Oct 2026, 11 Sep 2026 and 24 May 2024
    reports are archived locally. | Source URL not recorded by research (https://documents.pse.com.ph/market_report/<Month
    DD, YYYY>-EOD.pdf (e.g. https://documents.pse.com.ph/market_report/October%2002,%202026-EOD.pdf)).'
