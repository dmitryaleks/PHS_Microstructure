<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSE Equity Microstructure</title>
<meta name="description" content="Offline knowledge base of Philippine Stock Exchange equity market microstructure, for execution and trading design.">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b4f9c'/><text x='16' y='22' font-family='sans-serif' font-size='15' font-weight='bold' fill='white' text-anchor='middle'>PH</text></svg>">
<script>
  // Apply the saved theme before first paint. Storage can be unavailable at file://
  // in some browsers or privacy modes, so every access is guarded.
  try { var t = localStorage.getItem("pse-kb-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>

<header class="hdr">
  <button class="iconbtn navbtn" id="navToggle" aria-label="Toggle navigation">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="mark">PH</span>
    <span class="brand-text">PSE Equity Microstructure <span class="sub">/ execution reference</span></span>
  </a>

  <div class="hdr-spacer"></div>

  <div class="searchbox" id="searchbox">
    <span class="icon" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </span>
    <input id="q" type="search" placeholder="Search chapters and source documents…"
           autocomplete="off" spellcheck="false" aria-label="Search" aria-controls="spanel">
    <kbd>/</kbd>
  </div>

  <button class="iconbtn" id="themeBtn" aria-label="Toggle colour theme" title="Toggle colour theme">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Chapters"></nav>
  <main class="main" id="main"><div class="wrap" id="view"><p class="loading">Loading…</p></div></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="spanel" id="spanel" role="dialog" aria-label="Search results" hidden>
  <div class="sinfo">
    <span id="sstat">Type to search</span>
    <span class="grow"></span>
    <span class="keys">↑↓ navigate · ↵ open · esc close</span>
  </div>
  <div class="sresults" id="sresults" role="listbox"></div>
</div>

<!-- Data ships as classic scripts assigning globals; nothing is fetched at runtime.
     file:// is an opaque origin, so fetch/XHR/ES modules would all be blocked.
     data/kb-fulltext.js is injected lazily on first search. -->
<script src="assets/minisearch.min.js"></script>
<script src="data/kb-chapters.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
