findings:
  - id: F-01
    severity: defect
    area: build
    what: The markdown typographer rewrote "(c)" to "(c)"-symbol and "(r)" to "(r)"-symbol, corrupting legal references such as "s.10(c)".
    resolution: fixed -- the "replacements" rule is disabled in tools/build_kb.py; smart quotes kept.
  - id: F-02
    severity: coverage
    area: sources
    what: 83 archived PDFs are fully or partly scanned; the 2010 Revised Trading Rules, DMA rules, VWAP rules, CMIC rules, BIR regulations and Republic Acts had no text layer, so full-text search could not see them.
    resolution: fixed -- tools/ocr_sources.py (Windows OCR) now OCRs any document with >= 30% text-less pages; 1,346 pages recovered into sources/ocr/. The first pass used a whole-document average and missed 48 partially scanned files (a typed cover over scanned rule pages); detection is now per page.
  - id: F-03
    severity: defect
    area: chapter 11
    what: Stated that a halted book "re-opens through an intraday auction"; the ITCH spec only says the engine models a halt as an intraday auction (indicative messages, auction type I) and does not say whether an uncross runs at the lift (chapters 06 and 07 say so).
    resolution: fixed -- wording aligned with chapters 06/07 and marked as inference.
  - id: F-04
    severity: defect
    area: chapter 17
    what: Dated PSE circular CN-2026-0022 (PDTC lending-pool readiness) 18 May 2026; the circular is dated 6 May 2026 on its face.
    resolution: fixed.
  - id: F-05
    severity: duplication
    area: archive
    what: Parallel researchers saved byte-identical PDFs under two slugs.
    resolution: fixed -- tools/dedupe_archive.py merged 10 pairs onto one canonical slug (rewriting citations in notes and catalog) and moved the copies to build/dupes/; researchers had already removed a few others.
  - id: F-06
    severity: currency
    area: chapters 02, 10
    what: PSE's January 2025 consolidated listing and disclosure rules still print an ex-date of record date minus 3 trading days; T+2 (24 Aug 2023) moved it to record date minus 1, confirmed on 493 EDGE dividend records.
    resolution: documented -- chapters state RD-1 and flag the stale compilation in a warn callout.
  - id: F-07
    severity: currency
    area: chapters 11, 13
    what: The consolidated rules print a 3:30 pm EDGE cut-off; 4:00 pm since 25 May 2026.
    resolution: documented.
  - id: F-08
    severity: currency
    area: chapter 10
    what: SCCP's website posts the 13 Mar 2018 T+3 rulebook; the in-force text is that rulebook as amended by memos through 8 Jul 2025.
    resolution: documented -- chapter 10 reconstructs the in-force rule set from the redline memos.
  - id: F-09
    severity: currency
    area: chapters 12, 14
    what: PSE's own investor page shows a 30% dividend withholding rate for non-resident foreign corporations; 25% (15% on the tax-sparing route) since CREATE.
    resolution: documented.

open_in_public_record:
  - Whether ITCH "broker anonymity" was ever activated (announced 2014, deferred at go-live; no activation notice found). Working assumption: resting orders anonymous, fills broker-identified.
  - Amend/cancel during the run-off (ITCH state table says no; Implementing Guidelines say cancel allowed).
  - The official closing price when the pre-close does not cross (working assumption: last traded price).
  - Block-sale settlement date (Guidelines say T+0; market is T+2) and SCCP guarantee coverage of blocks.
  - Circuit-breaker clock cut-offs, written for the pre-2020 pre-close, never restated.
  - Nasdaq Eqlipse order-entry, ITCH and MDF specifications (sub-licence only); SEC approval of One Lot One Share, the new tick table, the run-off change and Negotiated Trades.
  - Trading status of 16-18 Nov 2026; FTSE's 6 Oct 2026 country-classification announcement.
  - Real-time market-data fees and latency; message-rate limits; cancel-on-disconnect; institutional commission rates; SBL volumes and borrow fees.
