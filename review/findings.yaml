# Coordinator review of the PSE Equity Microstructure knowledge base.
# Two parts: `verified` -- headline parameters re-checked against the archived source page
# (independently of the chapter writers), and `findings` -- defects found during assembly,
# with their resolution. See review/REVIEW.md for the digest.

review:
  reviewed_at: 2026-10-07
  as_of: 2026-10-06
  method: [extracted-text, windows-ocr, page-render, cross-chapter-diff]
  scope: >-
    Spot-check of the parameters an execution engine or cost model would hard-code, plus the
    consistency defects surfaced by eleven parallel chapter writers. Not a line-by-line audit:
    each chapter writer separately page-checked its own key parameters against the PDFs, and the
    build refuses any citation to an unknown source or a page past the end of a document.

